# RAMA: CI propio (los workflows upstream de SourceGit quedaron en workflow_dispatch).
name: Rama CI
on:
  push:
    branches: [main]
    tags: ['rama-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Build y pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SourceGit.slnx -c Release -p:DisableAOT=true
      - name: Pruebas Rama.Core
        run: dotnet test tests/Rama.Core.Tests/Rama.Core.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=core.trx"
      - name: Pruebas Rama.Terminal
        run: dotnet test tests/Rama.Terminal.Tests/Rama.Terminal.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=terminal.trx"
      - name: Gate de cobertura (>= 80% Rama.Core)
        shell: bash
        run: bash scripts/coverage-gate.sh 80 Rama.Core tests
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/coverage.cobertura.xml

  package:
    name: Empaquetar ${{ matrix.rid }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/rama-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version desde el tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#rama-v}"
          echo "VERSION=${v:-$(cat VERSION)}" >> "$GITHUB_ENV"
      - name: Publish
        shell: bash
        run: dotnet publish src/SourceGit.csproj -c Release -r ${{ matrix.rid }} -o build/SourceGit -p:DisableAOT=true -p:DisableUpdateDetection=true
      - name: Paquete Windows
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.rid }}
        run: ./build/scripts/package.win.ps1
      - name: Paquete macOS (.app)
        if: startsWith(matrix.rid, 'osx-')
        env:
          RUNTIME: ${{ matrix.rid }}
        run: ./build/scripts/package.osx-app.sh
      - name: Paquete Linux (deb/rpm)
        if: startsWith(matrix.rid, 'linux-')
        env:
          RUNTIME: ${{ matrix.rid }}
          RAMA_SKIP_APPIMAGE: 1
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev fakeroot
          mv build/SourceGit/SourceGit build/SourceGit/sourcegit
          ./build/scripts/package.linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rama-${{ matrix.rid }}
          path: |
            build/rama_*.zip
            build/rama_*.deb
            build/rama-*.rpm
